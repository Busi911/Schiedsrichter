name: handball.net-Sonde

# Einmalige Hilfs-Sonde (keine Produktfunktion): ruft handball.net für einen
# Verein auf, protokolliert die API-Aufrufe der Seite und legt Screenshots als
# Artefakt ab. Läuft manuell oder bei Push auf den Branch claude/handball-net-probe.
on:
  workflow_dispatch:
    inputs:
      verein:
        description: Suchbegriff des Vereins
        default: Heuchelheim
  push:
    branches: [claude/handball-net-probe]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        working-directory: scripts/handball-net-probe
        run: |
          npm init -y >/dev/null
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Sonde ausführen
        working-directory: scripts/handball-net-probe
        env:
          VEREIN: ${{ github.event.inputs.verein || 'Heuchelheim' }}
          CLUB_ID: 18rmntb
        run: node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handball-net-sonde
          path: scripts/handball-net-probe/out

  nuliga-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handballpate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/handballpate?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/handballpate?sslmode=disable
      AUTH_SECRET: probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema migrieren
        run: npx drizzle-kit migrate
      - name: TSF Heuchelheim importieren (nuLiga HHV + handball.net)
        run: npx tsx scripts/handball-net-probe/import.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuliga-import-html
          path: out/html
